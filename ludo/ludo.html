<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            padding: 0;
            margin: 0;
        }

        .container {
            border: .5px solid;
            width: max-content;
            margin: auto;
        }

        .part1 {
            display: flex;
        }
        .part2{
            display: flex;
        }
        .part3{
            display: flex;
        }

        .redbox {
            border: 1px solid red;
            width: 250px;
            height: 250px;
            background-color: red;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;

        }

        .greenbox {
            border: 1px solid green;
            width: 250px;
            height: 250px;
            background-color: green;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }


        .bluebox{
          border: 1px solid blue;
            width: 250px;
            height: 250px;
            background-color: blue;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .yellowbox{border: 1px solid yellow;
            width: 250px;
            height: 250px;
            background-color: yellow;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;}

        .whitebox {
            width: 180px;
            height: 180px;
            background-color: rgb(255, 255, 255);
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            align-items: center;
            padding: 2px;
        }

        .circleR {
            height: 60px;
            width: 60px;
            border: 5px solid red;
            border-radius: 50%;
        }

        .circleG {
            height: 60px;
            width: 60px;
            border: 5px solid green;
            border-radius: 50%;
        }
        .circleB{ height: 60px;
            width: 60px;
            border: 5px solid blue;
            border-radius: 50%;}
        .circleY{height: 60px;
            width: 60px;
            border: 5px solid yellow;
            border-radius: 50%;}

        .middle {
            display: flex;
            flex-wrap: wrap;
            width: 124.5px;
            height: 250px;


        }

        .box {
            border: 0.5px solid;
            height: 40.5px;
            width: 40px;
        }
        .boxG{
             border: 0.5px solid;
            height: 40.5px;
            width: 40px;
            background-color: green;
        }
        .boxB{
            border: 0.5px solid;
            height: 40.5px;
            width: 40px;
            background-color: blue;
        }

        .box1{
            border: 0.5px solid;
            height: 40.5px;
            width: 40.2px;
        }
        .box1R{
            border: 0.5px solid;
            height: 40.5px;
            width: 40.2px;
            background-color: red;
        }
        .box2{
             border: 0.5px solid;
            height: 40.5px;
            width: 40.55px;
        }
        .box2Y{
            border: 0.5px solid;
            height: 40.5px;
            width: 40.55px;
            background-color: yellow; 
        }

        .middle1 {
            display: flex;
            flex-wrap: wrap;
            width: 250px;
            height: 125px;

        }
        .middle2{
             display: flex;
            flex-wrap: wrap;
            width: 252.5px;
            height: 125px;
        }


        .centerbox {
             
                width: 125px;
                height: 125.5px;
                position: relative;
                background-color: white;
            
        }

        .green {
            width: 100%;
            height: 50%;
            background-color: green;
            position: absolute;
            top: 0;
            left: 0;
            clip-path: polygon(0 0, 100% 0, 50% 100%);
        }

        .red {
            width: 50%;
            height: 100%;
            background-color: red;
            position: absolute;
            top: 0;
            left: 0;
            clip-path: polygon(0 0, 100% 50%, 0 100%);
        }

        .yellow {
            width: 50%;
            height: 100%;
            background-color: yellow;
            position: absolute;
            top: 0;
            right: 0;
            clip-path: polygon(100% 0, 100% 100%, 0 50%);
        }

        .blue {
            width: 100%;
            height: 50%;
            background-color: blue;
            position: absolute;
            bottom: 0;
            left: 0;
            clip-path: polygon(0 100%, 100% 100%, 50% 0);
        }
        .star{
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px; 
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="part1">
            <div class="redbox">
                <div class="whitebox">
                    <div class="circleR"></div>
                    <div class="circleR"></div>
                    <div class="circleR"></div>
                    <div class="circleR"></div>
                </div>
            </div>
            <div class="middle">
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>

                <div class="box"></div>
                <div class="boxG"></div>
                <div class="box"></div>
                <div class="box"></div>
                <div class="boxG"></div>
                <div class="box"></div>
            </div>
            <div class="greenbox">
                <div class="whitebox">
                    <div class="circleG"></div>
                    <div class="circleG"></div>
                    <div class="circleG"></div>
                    <div class="circleG"></div>
                </div>
            </div>
        </div>

        <div class="part2">
            <div class="middle1">
                <div class="box1"></div>

                <div class="box1"></div>
                <div class="box1"></div>
                <div class="box1"></div>
                <div class="box1"></div>
                <div class="box1"></div>
                <div class="box1R"></div>
                <div class="box1R"></div>
                <div class="box1R"></div>
                <div class="box1R"></div>
                <div class="box1R"></div>
                <div class="box1"></div>
                <div class="box1"></div>
                <div class="box1R"><p class="star">★</p></div>
                <div class="box1"></div>
                <div class="box1"></div>
                <div class="box1"></div>
            </div>

            <div class="centerbox">
                <div class="green"></div>
                <div class="red"></div>
                <div class="yellow"></div>
                <div class="blue"></div>
            </div>


             <div class="middle2">
                <div class="box2"></div>
                <div class="box2"></div>
                <div class="box2"></div>
                <div class="box2Y"><p class="star">★</p></div>
                <div class="box2"></div>
                <div class="box2"></div>
                <div class="box2Y"></div>
                <div class="box2Y"></div>
                <div class="box2Y"></div>
                <div class="box2Y"></div>
                <div class="box2Y"></div>
                <div class="box2"></div>
                <div class="box2"></div>
                <div class="box2"></div>
                <div class="box2"></div>
                <div class="box2"></div>
                <div class="box2Y"><p class="star">★</p></div>
                <div class="box2"></div>
             </div>
        </div>

        <div class="part3">
            <div class="bluebox">
                <div class="whitebox">
                    <div class="circleB"></div>
                    <div class="circleB"></div>
                    <div class="circleB"></div>
                    <div class="circleB"></div>
                </div>
            </div>
            <div class="middle">
                <div class="box"></div>
                <div class="boxB"></div>
                <div class="box"></div>
                <div class="box"></div>
                <div class="boxB"></div>
                <div class="box"></div>
                <div class="box"></div>
                <div class="boxB"></div>
                <div class="box"></div>
                <div class="box"></div>
                <div class="boxB"></div>
                <div class="boxB"><p class="star">★</p></div>
                <div class="boxB"> <p class="star">★</p></div>
                <div class="boxB"></div>
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
            </div>

            <div class="yellowbox">
                <div class="whitebox">
                    <div class="circleY"></div>
                    <div class="circleY"></div>
                    <div class="circleY"></div>
                    <div class="circleY"></div>
                </div>
            </div>
            
        </div>
    </div>
</body>

</html>
